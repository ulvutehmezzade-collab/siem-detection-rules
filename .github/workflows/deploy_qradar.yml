name: Deploy Rules to QRadar
​
on:
  push:
    paths:
      - 'qradar/**'
  workflow_dispatch:
​
jobs:
  deploy_qradar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
​
      - name: Push Rules via QRadar REST API
        env:
          QRADAR_HOST: ${{ secrets.QRADAR_HOST }}
          QRADAR_TOKEN: ${{ secrets.QRADAR_TOKEN }}
        run: |
          cat qradar/rules.json | jq -c '.[]' | while read -r rule; do
            RULE_NAME=$(echo "$rule" | jq -r '.name')
            echo "Deploying rule: $RULE_NAME"
            HTTP_CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
              --connect-timeout 15 --max-time 40 \
              -k -X POST "https://${QRADAR_HOST}/api/analytics/rules" \
              -H "SEC: ${QRADAR_TOKEN}" \
              -H "Version: 20.0" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d "$rule") || true
            echo "  -> HTTP $HTTP_CODE"
            cat /tmp/resp.json 2>/dev/null; echo
          done
